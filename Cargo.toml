[workspace]
members = [
    "crates/proof-core",
    "crates/proof-risc0-host",
    "crates/proof-risc0-guest",
    "crates/proof-risc0-methods",
    "crates/proof-sp1-host",
    "crates/proof-sp1-program",
    "crates/proof-sp1-aggregate-host",
    "crates/proof-sp1-aggregate-program",
    "crates/proof-sp1-tree-host",
    "crates/proof-sp1-tree-program",
    "crates/proof-sp1-crypto-profile-host",
    "crates/proof-sp1-crypto-profile-program",
    "crates/cosmwasm-sp1-verifier",
    "crates/cosmwasm-amaci-round",
    "patches/shake",
]
resolver = "2"

# SP1's patched hashes dispatch supported operations to syscalls only for the
# Succinct zkVM target. Native and RISC Zero targets retain their portable
# backends. These patches must live in the workspace manifest so sp1-build's
# nested Cargo invocation uses them when compiling each guest ELF.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.11.0-sp1-6.0.0" }
shake = { path = "patches/shake" }

# RISC Zero guests are expensive to build without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true

[profile.contract]
inherits = "release"
debug = 0
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = "symbols"
